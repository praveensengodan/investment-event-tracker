name: NSE Event Collector

on:
  schedule:
    # 6:05 AM IST (00:35 UTC) - Morning pre-market scan
    - cron: '35 0 * * *'
    # 6:35 PM IST (13:05 UTC) - Evening post-market filings scan
    - cron: '5 13 * * *'
  workflow_dispatch:

jobs:
  collect-events:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Collect NSE events
        run: |
          python nse_event_collector.py

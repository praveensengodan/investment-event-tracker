name: NSE Event Collector

on:
  workflow_dispatch:

jobs:
  collect-events:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Collect NSE events
        run: |
          python nse_event_collector.py
